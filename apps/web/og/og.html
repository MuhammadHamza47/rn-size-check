<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Source for public/og.png (1200x630 link preview). Re-render with: chrome --headless=new --window-size=1200,630 --screenshot=public/og.png og/og.html -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #e6edf3; padding: 64px 72px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 30px ui-monospace, 'Cascadia Code', Consolas, monospace; }
  h1 { font-size: 68px; line-height: 1.08; letter-spacing: -1.5px; margin-top: 44px; max-width: 900px; }
  p { font-size: 28px; color: #8d96a3; margin-top: 22px; max-width: 900px; }
  .bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin-top: auto; }
  .bar span:nth-child(1) { width: 36%; background: #2bb3bf; }
  .bar span:nth-child(2) { width: 24%; background: #f0806f; }
  .bar span:nth-child(3) { width: 21%; background: #9580f0; }
  .bar span:nth-child(4) { width: 8%; background: #66b85f; }
  .bar span:nth-child(5) { width: 7%; background: #f0bf3c; }
  .bar span:nth-child(6) { width: 4%; background: #6ea8f5; }
  .foot { display: flex; justify-content: space-between; margin-top: 20px; font-size: 24px; color: #8d96a3; }
  .foot b { color: #2bb3bf; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#2bb3bf"/><rect x="7" y="17" width="4" height="8" rx="1" fill="white"/><rect x="14" y="11" width="4" height="14" rx="1" fill="white"/><rect x="21" y="6" width="4" height="19" rx="1" fill="white"/></svg>
    rn-size-check
  </div>
  <h1>Why is your React Native app so big?</h1>
  <p>Drop your .aab or .apk and see what to fix, file by file, with the MB each fix saves. Nothing is uploaded.</p>
  <div class="bar"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="foot"><span>Free · open source · <b>npx rn-size-check</b></span><span>rn-size-check-web.vercel.app</span></div>
</body>
</html>
